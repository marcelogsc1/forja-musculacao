<script>
/* PWA: instala o service worker (funciona sem internet) e aplica atualizações sem interromper um treino */
if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) && (location.protocol === 'https:' || location.hostname === 'localhost')){
  let had = !!navigator.serviceWorker.controller, reloading = false;
  navigator.serviceWorker.register('sw.js').then(reg => setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000)).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had){ had = true; return; }
    if (reloading) return;
    const go = () => { reloading = true; location.reload(); };
    if (typeof openSession === 'function' && openSession()) toast('Nova versão do Forja pronta.', go, 'Atualizar', 15000); else go();
  });
}
</script>
